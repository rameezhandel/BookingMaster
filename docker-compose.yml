services:
  db:
    image: postgres:16-alpine
    container_name: bookingmaster-db
    environment:
      POSTGRES_USER: bookingmaster
      POSTGRES_PASSWORD: bookingmaster
      POSTGRES_DB: bookingmaster
    ports:
      - "5432:5432"
    volumes:
      - bookingmaster-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookingmaster-pgdata:
