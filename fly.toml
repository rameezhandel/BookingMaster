# Fly.io config. First run:
#   fly launch --no-deploy
#   fly postgres create --name bookingmaster-db --region bom
#   fly postgres attach bookingmaster-db          # sets DATABASE_URL
#   fly secrets set JWT_SECRET=$(openssl rand -hex 32)
#   fly deploy

app = "bookingmaster"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy on a temporary machine, so replicas never race the DDL.
  release_command = "node backend/dist/db/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 3000
  force_https = true

  # One machine always up, and this is not a preference.
  #
  # Scaling to zero on an idle web service is normally free money; here it stops
  # the clock. Six jobs need a live process: expired holds are swept every 30
  # seconds, queued WhatsApp messages go out every 10, reminders are queued
  # every 5 minutes, and there are nightly jobs at 3am and 4am to extend
  # recurring bookings and purge old messages. With no machine running, none of
  # them happen — expired holds keep blocking slots that are actually free,
  # confirmations sit unsent, and the reminder before a 7am game never fires.
  # Nothing reports this. It just looks like the app works erratically.
  #
  # Machines beyond the first still stop when idle, which is the saving worth
  # having. Running several is safe: every job takes a Postgres advisory lock
  # first, so only one instance does the work.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
